# Build and publish the macOS printer-app installer on version tags.
#
# Trigger: push a tag matching v* (e.g. v0.1.0), or run manually.
# Release notes: scripts/generate-release-notes.sh (from CHANGELOG.md).
# See docs/10-release-process.md.

name: Release macOS package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (e.g. 0.1.0). Defaults to tag or Makefile VERSION."
        required: false
        type: string

permissions:
  contents: write

jobs:
  macos-pkg:
    name: Build macOS .pkg
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(grep '^VERSION' Makefile | awk '{print $3}')"
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "Resolved VERSION=${V}"

      - name: Validate changelog section
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: ./scripts/generate-release-notes.sh "$VERSION" > /tmp/release-notes.md

      - name: Install Homebrew dependencies
        run: |
          brew install \
            autoconf \
            automake \
            gettext \
            jpeg-turbo \
            libpng \
            libtool \
            libusb \
            openssl@3 \
            pkg-config

      - name: Fetch third-party sources
        run: |
          git clone --depth 1 --branch v1.4.8 \
            https://github.com/michaelrsweet/pappl.git third_party/pappl
          git clone --depth 1 \
            https://github.com/koenkooi/gutenprint.git third_party/gutenprint

      - name: Build package
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: make package

      - name: Smoke-test binaries
        run: |
          ./build/i9950-printer-app --version
          ./build/i9950-tool --dry-run list
          make test

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: i9950-printer-app-${{ steps.ver.outputs.version }}-macos
          path: build/i9950-printer-app.pkg
          if-no-files-found: error

      - name: Create or update GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          ASSET="build/i9950-printer-app-${VERSION}-macos.pkg"
          cp build/i9950-printer-app.pkg "$ASSET"
          ./scripts/generate-release-notes.sh "$VERSION" > /tmp/release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "i9950 Printer Application ${VERSION}" \
              --notes-file /tmp/release-notes.md
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --title "i9950 Printer Application ${VERSION}" \
              --notes-file /tmp/release-notes.md
          fi
